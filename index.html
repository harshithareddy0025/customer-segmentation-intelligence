<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Customer Segmentation Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#16202e;--mut:#6a7688;--line:#e3e8f0;--acc:#7a4df0;--bad:#e5484d;--good:#2ea66b;--warn:#e8a317;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f141c;--card:#18202c;--ink:#e8edf5;--mut:#8b97aa;--line:#273142;--acc:#9a7bff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f141c;--card:#18202c;--ink:#e8edf5;--mut:#8b97aa;--line:#273142;--acc:#9a7bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 20px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:19px;margin:0}h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
nav{display:flex;gap:4px;padding:12px 20px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--mut);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{padding:18px 20px 40px;max-width:1280px;margin:auto}
.g{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.c3{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 4px;font-size:14px}.sub{color:var(--mut);font-size:12px;margin:0 0 12px}
.kpi b{font-size:25px;display:block;line-height:1.2}.kpi span{color:var(--mut);font-size:12px}
.br{display:grid;grid-template-columns:120px 1fr 56px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bt{background:var(--line);height:10px;border-radius:6px;overflow:hidden}.bt i{display:block;height:100%;border-radius:6px}.br b{text-align:right}
.dv{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.dvb{position:relative;height:10px;background:var(--line);border-radius:4px}.dvb:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--mut)}.dvb i{position:absolute;top:0;height:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600;font-size:11.5px}.wrap{overflow-x:auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:11.5px;margin:2px 4px 2px 0}
select,input[type=text]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
input[type=range]{width:100%}.sl{margin:10px 0}.sl label{display:flex;justify-content:space-between;font-size:12.5px}
.chat{height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:92%;padding:9px 12px;border-radius:12px;border:1px solid var(--line)}.m.u{align-self:flex-end;background:var(--acc);color:#fff;border:0}.m.a{background:var(--bg)}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.qs button,.btn{background:var(--card);color:var(--acc);border:1px solid var(--line);border-radius:16px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.btn.p{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 16px}.row{display:flex;gap:8px}.row input{flex:1}
.quote{border-left:3px solid var(--acc);padding:6px 10px;background:var(--bg);border-radius:0 8px 8px 0;font-size:12.5px;margin-top:8px}
.good{color:var(--good)}.bad{color:var(--bad)}ul{padding-left:18px;margin:6px 0}
</style></head><body>
<header><h1>Customer Segmentation Intelligence<small>Behavioral clustering and campaign strategy · synthetic dataset of 900 customers · last 12 months</small></h1><span class="sub" id="meta"></span></header>
<nav id="nav"></nav><main id="view"></main>
<script>
const $=s=>document.querySelector(s);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(11),gs=()=>Math.sqrt(-2*Math.log(1-R()))*Math.cos(6.283185*R()),cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const fm=v=>v>=1e7?'₹'+(v/1e7).toFixed(2)+' Cr':v>=1e5?'₹'+(v/1e5).toFixed(1)+' L':'₹'+Math.round(v).toLocaleString('en-IN'),pc=x=>(x*100).toFixed(1)+'%';
const PAL=['#7a4df0','#2ea66b','#e8a317','#e5484d','#2f8fe0','#d4559e','#16a6a6','#8a6d3b'];
// name,weight,rec,sd,freq,sd,aov,sd,disc,cats,email,sess,ret,tix,age
const A=[['Champions',.12,15,10,24,6,2500,600,.1,5,60,20,.05,1,42],['Loyal',.2,30,20,12,4,1400,300,.2,3.5,50,10,.08,1,40],['Deal',.18,40,30,9,4,700,200,.65,3,55,8,.15,1.5,31],['New',.14,20,15,2,1,900,250,.3,2,45,6,.1,.5,28],['Lapsing',.14,200,60,5,3,1300,300,.3,2.5,15,1.5,.1,1,38],['Big',.08,90,50,3,1.5,6000,1500,.1,1.5,35,4,.06,.8,45],['Service',.08,60,40,7,3,1000,250,.35,3,30,5,.35,6,36],['Digital',.06,25,15,10,3,800,200,.3,4,75,28,.08,.8,27]];
const C=[];for(let i=0;i<900;i++){let u=R(),a=A[0];for(const x of A){if((u-=x[1])<=0){a=x;break}}
const sd=v=>Math.max(1,v*.25),f=Math.max(1,Math.round(gs()*a[5]+a[4])),av=Math.max(150,gs()*a[7]+a[6]);
C.push({id:'C'+(5001+i),rec:Math.round(cl(gs()*a[3]+a[2],1,365)),freq:f,aov:Math.round(av),spend:Math.round(f*av),disc:cl(gs()*.1+a[8],0,1),cats:cl(Math.round(gs()+a[9]),1,8),email:cl(gs()*12+a[10],1,98),sess:Math.max(0,gs()*sd(a[11])+a[11]),ret:cl(gs()*.04+a[12],0,.8),tix:Math.max(0,Math.round(gs()*Math.max(.7,a[13]*.35)+a[13])),age:cl(Math.round(gs()*11+a[14]),18,75),gender:R()<.52?'F':'M',tier:1+Math.floor(R()*3)})}
const N=C.length,FN=['Recency','Frequency','Spend','Avg order','Discount use','Categories','Email opens','App sessions','Returns','Tickets'];
const X=C.map(c=>[c.rec,Math.log(c.freq),Math.log(c.spend),Math.log(c.aov),c.disc,c.cats,c.email,c.sess,c.ret,c.tix]);
const mu=FN.map((_,j)=>X.reduce((a,r)=>a+r[j],0)/N),sdv=FN.map((_,j)=>Math.sqrt(X.reduce((a,r)=>a+(r[j]-mu[j])**2,0)/N)),Z=X.map(r=>r.map((v,j)=>(v-mu[j])/sdv[j]));
const dist=(a,b)=>{let s=0;for(let j=0;j<a.length;j++)s+=(a[j]-b[j])**2;return s};
function km(k,seed){const r=rng(seed);let cen=[Z[Math.floor(r()*N)].slice()];while(cen.length<k){const d=Z.map(p=>Math.min(...cen.map(c=>dist(p,c)))),s=d.reduce((a,b)=>a+b);let t=r()*s,i=0;for(;i<N-1&&(t-=d[i])>0;i++);cen.push(Z[i].slice())}
const lab=Array(N).fill(0);for(let it=0;it<40;it++){let ch=0;Z.forEach((p,i)=>{let b=0,bd=1e9;cen.forEach((c,q)=>{const d=dist(p,c);if(d<bd){bd=d;b=q}});if(lab[i]!=b){lab[i]=b;ch++}});
cen=cen.map((c,q)=>{const m=Z.filter((_,i)=>lab[i]==q);return m.length?c.map((_,j)=>m.reduce((a,p)=>a+p[j],0)/m.length):c});if(!ch)break}
return{lab,inertia:Z.reduce((a,p,i)=>a+dist(p,cen[lab[i]]),0)}}
function sil(lab,k){let tot=0,cnt=0;for(let i=0;i<N;i+=2){const s=Array(k).fill(0),c=Array(k).fill(0);for(let j=0;j<N;j++){if(j==i)continue;s[lab[j]]+=Math.sqrt(dist(Z[i],Z[j]));c[lab[j]]++}
const a=s[lab[i]]/Math.max(1,c[lab[i]]);let b=1e9;for(let q=0;q<k;q++)if(q!=lab[i]&&c[q])b=Math.min(b,s[q]/c[q]);tot+=(b-a)/Math.max(a,b);cnt++}return tot/cnt}
const RS={};for(let k=2;k<=8;k++){let b=null;for(let s=1;s<=3;s++){const r=km(k,s*17+k);if(!b||r.inertia<b.inertia)b=r}b.sil=sil(b.lab,k);RS[k]=b}
let K=[4,5,6,7,8].sort((a,b)=>RS[b].sil-RS[a].sil)[0],SEG=[];
const NM=[['Champions',z=>z[1]+z[2]-z[0]+.3*z[5]],['Loyal Regulars',z=>.8*z[1]-.4*z[0]-.6*Math.abs(z[3])-z[8]],['Deal Seekers',z=>2*z[4]-.5*z[3]],['New Explorers',z=>-.6*z[0]-z[1]-.3*z[5]],['Lapsing Customers',z=>1.2*z[0]-z[6]-.5*z[7]],['Big-Ticket Buyers',z=>1.5*z[3]-.5*z[1]-.3*z[5]],['Service-Heavy',z=>z[9]+z[8]],['Digital Engagers',z=>z[7]+z[6]+.3*z[5]]];
const STR={'Champions':{o:'Reward and turn into advocates',of:'Early access, tiered perks, no blanket discounts',ch:'App push + email',kpi:'Referral rate, share of wallet',cad:'2 touches/month',s:'VIP early access',m:'You are first in line: early access to the new collection, with your VIP perks unlocked.'},
'Loyal Regulars':{o:'Grow basket size and categories',of:'Points multipliers, bundle cross-sell',ch:'Email',kpi:'Basket size, categories per customer',cad:'Weekly',s:'Your next order earns double points',m:'Thank you for staying with us. Complete your basket and earn double points on your next order.'},
'Deal Seekers':{o:'Convert profitably, protect margin',of:'Time-boxed flash deals on selected categories',ch:'WhatsApp + push',kpi:'Margin per order, deal conversion',cad:'Event-based',s:'48-hour flash sale on your favourites',m:'Flash sale for you: 20% off your favourite categories for 48 hours only.'},
'New Explorers':{o:'Drive the second purchase',of:'Onboarding journey, free shipping on 2nd order',ch:'Email + push',kpi:'2nd-order rate within 30 days',cad:'Days 3, 7, 14, 30',s:'Three picks for you, plus free shipping',m:'Welcome! Here are three categories picked for you, plus free shipping on your 2nd order.'},
'Lapsing Customers':{o:'Win back before they churn',of:'Personal comeback offer with an expiry',ch:'Email + WhatsApp',kpi:'Reactivation rate, 90-day revenue',cad:'3-step sequence over 3 weeks',s:'We miss you, a personal offer inside',m:'We miss you. Here is a personal offer to come back, valid for 7 days.'},
'Big-Ticket Buyers':{o:'Nurture high-value, rare purchases',of:'Expert consultation, 0% EMI, wishlist alerts',ch:'WhatsApp + direct call',kpi:'Qualified leads, average order value',cad:'Intent-triggered',s:'Book a free expert consultation',m:'Planning something special? Book a free consultation with our product expert and enjoy 0% EMI.'},
'Service-Heavy':{o:'Fix friction, rebuild trust',of:'Dedicated care manager, goodwill credit',ch:'Phone + WhatsApp',kpi:'Ticket volume, repeat-order rate',cad:'After each ticket',s:'Your care manager is here',m:'We heard you. A dedicated care manager is now assigned to your account, plus a goodwill credit.'},
'Digital Engagers':{o:'Monetize engagement',of:'In-app exclusive drops, gamified rewards',ch:'App push',kpi:'In-app conversion, sessions to order',cad:'Several per week',s:'New in the app: members-only drops',m:'New in the app: curated drops and in-app exclusive rewards, just for you.'}};
function build(k){const lab=RS[k].lab,S=[];for(let q=0;q<k;q++){const ix=[];lab.forEach((l,i)=>{if(l==q)ix.push(i)});if(!ix.length)continue;const m=ix.map(i=>C[i]),av=f=>m.reduce((a,c)=>a+f(c),0)/m.length;
S.push({ix,m,n:m.length,z:FN.map((_,j)=>ix.reduce((a,i)=>a+Z[i][j],0)/ix.length),rev:m.reduce((a,c)=>a+c.spend,0),rec:av(c=>c.rec),freq:av(c=>c.freq),aov:av(c=>c.aov),spend:av(c=>c.spend),disc:av(c=>c.disc),email:av(c=>c.email),sess:av(c=>c.sess),ret:av(c=>c.ret),tix:av(c=>c.tix),age:av(c=>c.age)})}
const pr=[];S.forEach((s,i)=>NM.forEach(nm=>pr.push([nm[1](s.z),i,nm[0]])));pr.sort((a,b)=>b[0]-a[0]);const du=new Set,dn=new Set;pr.forEach(p=>{if(!du.has(p[1])&&!dn.has(p[2])){S[p[1]].name=p[2];du.add(p[1]);dn.add(p[2])}});
S.sort((a,b)=>b.rev-a.rev);S.forEach((s,i)=>s.c=PAL[i%8]);const tr=C.reduce((a,c)=>a+c.spend,0);S.forEach(s=>{s.rs=s.rev/tr;s.cs=s.n/N});SEG=S}
function eta(v,g){const m=v.reduce((a,b)=>a+b)/v.length,gr={};v.forEach((x,i)=>(gr[g[i]]=gr[g[i]]||[]).push(x));let ssb=0;for(const q in gr){const a=gr[q].reduce((x,y)=>x+y)/gr[q].length;ssb+=gr[q].length*(a-m)**2}return ssb/v.reduce((a,x)=>a+(x-m)**2,0)}
const ls=C.map(c=>Math.log(c.spend)),band=a=>a<25?'18-24':a<35?'25-34':a<45?'35-44':a<55?'45-54':'55+';
function bars(rows,fmt,max){max=max||Math.max(...rows.map(r=>r[1]));return rows.map(r=>`<div class=br><span>${r[0]}</span><div class=bt><i style="width:${r[1]/max*100}%;background:${r[2]||'var(--acc)'}"></i></div><b>${fmt(r[1])}</b></div>`).join('')}
const CHN={email:['Email',1,c=>c.email/100],push:['App push',.5,c=>Math.min(1,c.sess/20)],wa:['WhatsApp',4,c=>.4]};
function ev(list,ch,d){let inc=0,rv=0,cost=0,pf=0;list.forEach(c=>{const bp=cl(.03+.07*Math.min(c.freq/24,1)+.04*(1-c.rec/365),.02,.2),af=CHN[ch][2](c),se=.1+1.2*c.disc,p=Math.min(.6,bp*af*(.35+se*d/10*1.2));
inc+=p;rv+=p*c.aov;cost+=CHN[ch][1];pf+=p*c.aov*(.35-d/100)-bp*af*c.aov*d/100-CHN[ch][1]});return{n:list.length,rr:inc/list.length,rv,cost,pf,roi:pf/cost}}
function best(list){let b=null;for(const ch in CHN)for(const d of[0,5,10,15,20,25]){const r=ev(list,ch,d);if(!b||r.pf>b.pf)b={...r,ch,d}}return b}
const T=[['ov','Overview'],['ds','Segment discovery'],['pf','Segment profiles'],['cs','Campaign studio'],['ag','AI agent'],['br','Problem brief']];
let tab=(location.hash||'#ov').slice(1);if(!T.some(t=>t[0]==tab))tab='ov';
function go(t){tab=t;location.hash=t;nav();V[t]()}
function nav(){$('#nav').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');$('#meta').textContent=K+' segments · silhouette '+RS[K].sil.toFixed(2)}
const kp=(b,s)=>`<div class="card kpi"><span>${s}</span><b>${b}</b></div>`,sn=s=>`<span class=dot style="background:${s.c}"></span>${s.name}`;
function plan(){const rows=SEG.map(s=>({s,b:best(s.m)})),tot=rows.reduce((a,r)=>a+r.b.pf,0),bl=ev(C,'email',15);return{rows,tot,bl,up:bl.pf>0?tot/bl.pf-1:null}}
const V={
ov(){const tr=C.reduce((a,c)=>a+c.spend,0),dm=Math.max(eta(ls,C.map(c=>band(c.age))),eta(ls,C.map(c=>c.gender)),eta(ls,C.map(c=>c.tier))),bh=eta(ls,RS[K].lab),p=plan();
$('#view').innerHTML=`<div class="g k">${kp(N,'Active customers')}${kp(fm(tr),'12-month revenue')}${kp(fm(tr/N),'Average spend per customer')}${kp(K,'Behavioral segments found')}${kp(pc(bh),'Spend variance explained by behavior')}${kp(pc(dm),'… explained by best demographic cut')}</div>
<div class="g c2" style="margin-top:14px"><div class=card><h3>Customer share by segment</h3><p class=sub>Who the customers are</p>${bars(SEG.map(s=>[sn(s),s.cs,s.c]),pc)}</div><div class=card><h3>Revenue share by segment</h3><p class=sub>Where the money comes from</p>${bars(SEG.map(s=>[sn(s),s.rs,s.c]),pc)}</div>
<div class=card><h3>Headline finding</h3><p>Demographic groups (age, gender, city tier) explain only <b>${pc(dm)}</b> of the differences in customer spend. Behavioral segments explain <b>${pc(bh)}</b>. The broad demographic approach is therefore targeting the wrong things.</p><p class=quote><b>${SEG[0].name}</b> are ${pc(SEG[0].cs)} of customers but ${pc(SEG[0].rs)} of revenue.</p></div>
<div class=card><h3>Segmented vs broad campaign</h3><p class=sub>Modelled next-campaign profit across all customers</p>${bars([['Broad: email, 15% off',Math.max(0,p.bl.pf),'var(--mut)'],['Segment-specific plan',p.tot,'var(--good)']],fm)}<p>${p.up==null?'The broad blast is not profitable, while a tailored plan is.':`Tailoring the channel and offer per segment lifts modelled profit by <b class=good>${(p.up*100).toFixed(0)}%</b>.`} See Campaign studio for the plan.</p></div></div>`},
ds(){$('#view').innerHTML=`<div class="g c2"><div class=card><h3>How many segments?</h3><p class=sub>K-means on 10 behavioral features. Higher silhouette means cleaner separation; lower inertia means tighter groups.</p><div class=sl><label>Number of segments (k)<b id=kv>${K}</b></label><input type=range id=kr min=3 max=8 value=${K}></div>
<p class=sub style="margin:10px 0 2px">Silhouette score</p>${bars([2,3,4,5,6,7,8].map(k=>['k = '+k,RS[k].sil,k==K?'var(--acc)':'var(--mut)']),x=>x.toFixed(2),.6)}<p class=sub style="margin:10px 0 2px">Inertia (within-cluster spread)</p>${bars([2,3,4,5,6,7,8].map(k=>['k = '+k,RS[k].inertia,k==K?'var(--acc)':'var(--mut)']),x=>Math.round(x))}</div>
<div class=card><h3>Segment map: recency vs spend</h3><p class=sub>Each dot is a customer, coloured by discovered segment</p><svg viewBox="0 0 400 270" style="width:100%"><line x1=30 y1=240 x2=390 y2=240 stroke="var(--line)"/><line x1=30 y1=10 x2=30 y2=240 stroke="var(--line)"/>
${C.map((c,i)=>{const s=SEG.find(s=>s.ix.includes(i));return`<circle cx="${30+c.rec/365*355}" cy="${240-(Math.log(c.spend)-6)/(Math.log(300000)-6)*225}" r="2.6" fill="${s.c}" opacity=".6"/>`}).join('')}<text x=210 y=262 font-size=10 text-anchor=middle fill="var(--mut)">Days since last purchase →</text><text x=8 y=125 font-size=10 fill="var(--mut)" transform="rotate(-90 8 125)" text-anchor=middle>12-month spend (log)</text></svg></div>
<div class=card><h3>Demographic vs behavioral segmentation</h3><p class=sub>Share of customer spend variation explained (eta-squared)</p>${bars([['Age band',eta(ls,C.map(c=>band(c.age)))],['Gender',eta(ls,C.map(c=>c.gender))],['City tier',eta(ls,C.map(c=>c.tier))],['Behavioral (k='+K+')',eta(ls,RS[K].lab),'var(--good)']],pc,1)}<p class=sub>Behavioral variables include spend, so this comparison favors them. The bigger test is whether campaigns respond differently, shown in Campaign studio.</p></div></div>`;
$('#kr').oninput=e=>{K=+e.target.value;build(K);nav();V.ds()}},
pf(){$('#view').innerHTML=`<div class="g c3">${SEG.map(s=>{const st=STR[s.name],ks=[0,1,2,4,6,7];return`<div class=card style="border-top:4px solid ${s.c}"><h3>${s.name}</h3><p class=sub>${s.n} customers (${pc(s.cs)}) · ${pc(s.rs)} of revenue · avg age ${s.age.toFixed(0)}</p>
<div class=wrap><table><tr><th>Recency</th><th>Orders</th><th>Avg order</th><th>Spend</th></tr><tr><td>${s.rec.toFixed(0)}d</td><td>${s.freq.toFixed(1)}</td><td>${fm(s.aov)}</td><td>${fm(s.spend)}</td></tr></table></div>
<div style="margin-top:8px">${ks.map(j=>`<div class=dv><span>${FN[j]}</span><div class=dvb><i style="${s.z[j]>0?'left:50%':'right:50%'};width:${Math.min(50,Math.abs(s.z[j])*22)}%;background:${s.z[j]>0?'var(--acc)':'var(--mut)'}"></i></div><span>${s.z[j]>0?'+':''}${s.z[j].toFixed(1)}</span></div>`).join('')}</div>
<p style="margin:10px 0 4px"><b>Strategy:</b> ${st.o}</p><span class=tag>Offer: ${st.of}</span><span class=tag>Channel: ${st.ch}</span><span class=tag>Cadence: ${st.cad}</span><span class=tag>KPI: ${st.kpi}</span>
<div class=quote><b>${st.s}</b><br>${st.m}</div></div>`}).join('')}</div>`},
cs(){const p=plan();$('#view').innerHTML=`<div class="g c2"><div class=card><h3>Campaign studio</h3><p class=sub>Test any audience, channel and discount.</p><label class=sub>Audience</label><br><select id=a><option value=all>All customers</option>${SEG.map((s,i)=>`<option value=${i}>${s.name}</option>`).join('')}</select><br><label class=sub style="margin-top:8px;display:block">Channel</label><select id=c>${Object.keys(CHN).map(k=>`<option value=${k}>${CHN[k][0]}</option>`).join('')}</select>
<div class=sl><label>Discount offered (%)<b id=dv>10</b></label><input type=range id=d min=0 max=25 step=5 value=10></div><div id=co></div></div>
<div class=card><h3>Auto-optimized segment plan</h3><p class=sub>Best channel and discount per segment by modelled profit</p><div class=wrap><table><tr><th>Segment</th><th>Channel</th><th>Offer</th><th>Resp.</th><th>Profit</th></tr>${p.rows.map(r=>`<tr><td>${sn(r.s)}</td><td>${CHN[r.b.ch][0]}</td><td>${r.b.d?r.b.d+'% off':'No discount'}</td><td>${pc(r.b.rr)}</td><td>${fm(r.b.pf)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td></td><td></td><td></td><td><b>${fm(p.tot)}</b></td></tr></table></div><p class=sub style="margin-top:10px">Broad baseline (email, 15% off, everyone): ${fm(p.bl.pf)}.</p></div></div>`;
const u=()=>{const a=$('#a').value,l=a=='all'?C:SEG[+a].m,d=+$('#d').value;$('#dv').textContent=d;const r=ev(l,$('#c').value,d),b=best(l);$('#co').innerHTML=`<div class="g k" style="margin-top:12px"><div class=kpi><span>Reach</span><b>${r.n}</b></div><div class=kpi><span>Incremental response</span><b>${pc(r.rr)}</b></div><div class=kpi><span>Incremental revenue</span><b>${fm(r.rv)}</b></div><div class=kpi><span>Net profit</span><b class="${r.pf>=0?'good':'bad'}">${fm(r.pf)}</b></div></div><p class=sub style="margin-top:12px">Best option for this audience: <b>${CHN[b.ch][0]}, ${b.d?b.d+'% off':'no discount'}</b> with ${fm(b.pf)} modelled profit. Assumes 35% margin, per-contact costs of ₹1 (email), ₹0.5 (push), ₹4 (WhatsApp), and discount leakage on customers who would have bought anyway.</p>`};['a','c','d'].forEach(i=>$('#'+i).oninput=u);u()},
ag(){$('#view').innerHTML=`<div class="g c2"><div class=card><h3>Customer intelligence agent</h3><p class=sub>Ask about segments, value, risk, strategy or message copy.</p><div class=chat id=ch></div><div class=qs>${['What segments did you find?','Which segment is most valuable?','Who is at risk of churning?','Strategy for Deal Seekers','Write a message for Champions','Segmented vs broad campaign','Why not demographics?'].map(q=>`<button onclick="ask('${q}')">${q}</button>`).join('')}</div><div class=row><input type=text id=qi placeholder="e.g. what if we send 10% off by push to New Explorers?"><button class="btn p" onclick="ask()">Ask</button></div></div>
<div class=card><h3>Priority actions</h3><p class=sub>Ranked by modelled profit per customer</p><table><tr><th>Segment</th><th>Action</th><th>₹ / customer</th></tr>${plan().rows.sort((a,b)=>b.b.pf/b.s.n-a.b.pf/a.s.n).map(r=>`<tr><td>${sn(r.s)}</td><td>${CHN[r.b.ch][0]}, ${r.b.d?r.b.d+'%':'no discount'}</td><td><b>${(r.b.pf/r.s.n).toFixed(0)}</b></td></tr>`).join('')}</table></div></div>`;
$('#qi').onkeydown=e=>{if(e.key=='Enter')ask()};say('a','Hello, I am your customer intelligence analyst. I have discovered '+K+' behavioral segments. What would you like to know?')},
br(){$('#view').innerHTML=`<div class="g c2"><div class=card><h3>The problem</h3><p>The company groups customers by demographics such as age, gender and city. A 28-year-old who buys weekly and a 28-year-old who bought once last year get the same campaign. This wastes budget, over-discounts loyal buyers and ignores customers drifting away.</p><h3>The ask</h3><ul><li><b>Discover</b> behavioral segments from transactions and interactions, with no predefined labels.</li><li><b>Interpret</b> each segment as a persona using an LLM-style narrative layer.</li><li><b>Recommend</b> a differentiated strategy per segment: offer, channel, cadence, KPI and message copy.</li><li><b>Prove value</b> by comparing against the broad campaign.</li></ul></div>
<div class=card><h3>Solution architecture</h3><ul><li><b>Features:</b> RFM (recency, frequency, monetary) plus average order value, discount reliance, category breadth, email opens, app sessions, returns and support tickets.</li><li><b>Clustering:</b> standardized, log-scaled features; k-means with restarts; k selected by silhouette and inertia.</li><li><b>Interpretation:</b> centroid profiles are scored against persona templates and given names and strategies. In production, an LLM receives the centroid stats and writes the persona, strategy and copy.</li><li><b>Optimization:</b> response and profit model per channel and discount.</li><li><b>Agent:</b> chat over all of the above.</li></ul></div>
<div class=card><h3>Assumed data</h3><div class=wrap><table><tr><th>Source</th><th>Fields</th></tr><tr><td>Transactions</td><td>orders, spend, average order, discount share, categories, returns</td></tr><tr><td>Digital</td><td>email open rate, app sessions per month</td></tr><tr><td>Support/CRM</td><td>tickets, age, gender, city tier</td></tr></table></div></div>
<div class=card><h3>Caveats</h3><ul><li>The data is synthetic, generated from 8 hidden behavior types, so recovery of segments demonstrates the method only.</li><li>Response and profit figures come from an assumed model. Run A/B tests with holdout groups before scaling.</li><li>The persona writer is rule-based here; with real data, use an LLM with human review.</li><li>Respect consent and privacy rules when contacting customers.</li></ul></div></div>`}};
function say(w,h){const c=$('#ch');c.insertAdjacentHTML('beforeend',`<div class="m ${w}">${h}</div>`);c.scrollTop=c.scrollHeight}
function ask(q){q=q||$('#qi').value.trim();if(!q)return;$('#qi').value='';say('u',q);say('a','<i>Analysing…</i>');setTimeout(()=>{$('#ch').lastChild.remove();say('a',agent(q))},350)}
const KW={champion:'Champions',loyal:'Loyal Regulars',deal:'Deal Seekers',bargain:'Deal Seekers',new:'New Explorers',lapsing:'Lapsing Customers',churn:'Lapsing Customers',big:'Big-Ticket Buyers',service:'Service-Heavy',digital:'Digital Engagers'};
function agent(q){const t=q.toLowerCase();let seg=SEG.find(s=>t.includes(s.name.toLowerCase()));if(!seg)for(const k in KW)if(new RegExp('\\b'+k).test(t)){seg=SEG.find(s=>s.name==KW[k]);if(seg)break}
const ch=/whatsapp|\bwa\b/.test(t)?'wa':/push|app/.test(t)?'push':/email|mail/.test(t)?'email':null,num=(t.match(/(\d+)\s*%?/)||[])[1];
if(/what if|simulate|test/.test(t)&&(ch||num)){const l=seg?seg.m:C,r=ev(l,ch||'email',num?cl(+num,0,25):10);return`Simulating <b>${CHN[ch||'email'][0]}, ${num?cl(+num,0,25):10}% off</b> to ${seg?seg.name:'all customers'} (${r.n}): incremental response <b>${pc(r.rr)}</b>, revenue <b>${fm(r.rv)}</b>, net profit <b class="${r.pf>=0?'good':'bad'}">${fm(r.pf)}</b>.`+(r.pf<0?' This loses money, mostly from discounting customers who would buy anyway.':'')}
if(/write|message|copy|email text|subject/.test(t)&&seg){const s=STR[seg.name];return`Draft for <b>${seg.name}</b> via ${s.ch}:<div class=quote><b>Subject:</b> ${s.s}<br>${s.m}</div>`}
if(seg&&/strateg|recommend|how|campaign|offer|target/.test(t)||seg&&!/who|risk/.test(t)){const s=STR[seg.name],b=best(seg.m);return`<b>${seg.name}</b>: ${seg.n} customers, ${pc(seg.rs)} of revenue, avg order ${fm(seg.aov)}, recency ${seg.rec.toFixed(0)} days. <b>Goal:</b> ${s.o}. <b>Offer:</b> ${s.of}. <b>Channel:</b> ${s.ch}, ${s.cad.toLowerCase()}. <b>KPI:</b> ${s.kpi}. The model's best option is ${CHN[b.ch][0]} with ${b.d?b.d+'% off':'no discount'} (${fm(b.pf)} profit).`}
if(/risk|churn|lapsing|leav/.test(t)){const l=SEG.filter(s=>/Lapsing|Service/.test(s.name));return l.length?`At risk: ${l.map(s=>`<b>${s.name}</b> (${s.n} customers, ${fm(s.rev)} past revenue, last purchase ${s.rec.toFixed(0)} days ago)`).join(' and ')}. Start with a 3-step win-back sequence and a service recovery for the heavy-ticket group.`:'No clearly lapsing segment at this k; try a higher k in Segment discovery.'}
if(/valuable|revenue|best|top|worth/.test(t)){const s=SEG[0],p=[...SEG].sort((a,b)=>b.spend-a.spend)[0];return`<b>${s.name}</b> bring the most revenue (${pc(s.rs)} from ${pc(s.cs)} of customers). Highest spend per customer is <b>${p.name}</b> at ${fm(p.spend)} a year.`}
if(/demograph|age|gender|why not/.test(t)){const dm=Math.max(eta(ls,C.map(c=>band(c.age))),eta(ls,C.map(c=>c.gender)),eta(ls,C.map(c=>c.tier)));return`Best demographic cut explains only <b>${pc(dm)}</b> of spend variation, versus <b>${pc(eta(ls,RS[K].lab))}</b> for behavioral segments. Age is also mixed within segments, so one age-based message would reach several different mindsets.`}
if(/broad|compare|segmented|roi|profit|uplift|budget/.test(t)){const p=plan();return`Broad email with 15% off to everyone: <b>${fm(p.bl.pf)}</b> modelled profit. Segment-specific plan: <b>${fm(p.tot)}</b>${p.up==null?'':', a lift of <b class=good>'+(p.up*100).toFixed(0)+'%</b>'}. The gain comes from withholding discounts from loyal customers and using each segment's best channel.`}
if(/segment|how many|found|discover|cluster/.test(t))return`I found <b>${K}</b> segments (silhouette ${RS[K].sil.toFixed(2)}):<ul>${SEG.map(s=>`<li>${sn(s)}: ${s.n} customers, ${pc(s.rs)} of revenue</li>`).join('')}</ul>`;
return'Try asking about <b>segments</b>, the <b>most valuable</b> group, <b>churn risk</b>, a <b>strategy for</b> a named segment, <b>message copy</b>, <b>demographics</b>, or a what-if like “10% off by push to New Explorers”.'}
build(K);nav();V[tab]();
</script></body></html>
